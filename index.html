<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-canvas-mini</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        padding: 24px;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        background: #17132c;
        font-family: system-ui, sans-serif;
      }
      #stage {
        width: min(960px, 95vw);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      #log {
        width: 380px;
        height: 540px;
        margin: 0;
        padding: 16px;
        overflow: hidden;
        box-sizing: border-box;
        border-radius: 16px;
        background: #0a0815;
        color: #5ed3f3;
        font: 13px/1.5 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <pre id="log" hidden></pre>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
